syntax = "proto3";
package juno.cwhooks.v2;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "juno/cwhooks/v2/genesis.proto";

option go_package = "github.com/CosmosContracts/juno/x/cw-hooks/types";

// Msg defines the Msg service
service Msg {
  option (cosmos.msg.v1.service) = true;
  // UpdateParams defines a governance operation for updating the x/clock module
  // parameters. The authority is hard-coded to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // RegisterStaking.
  rpc RegisterContract(MsgRegisterContract) returns (MsgRegisterContractResponse);

  // UnregisterContract.
  rpc UnregisterContract(MsgUnregisterContract) returns (MsgUnregisterContractResponse);
}

// MsgUpdateParams is the Msg/UpdateParams request type
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "juno/x/cwhooks/MsgUpdateParams";

  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;

  // authority is the address of the governance account
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the x/clock parameters to update.
  //
  // NOTE: All parameters must be supplied
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
//
// Since: cosmos-sdk 0.47
message MsgUpdateParamsResponse {}

// MsgRegisterContract
message MsgRegisterContract {
  option (cosmos.msg.v1.signer) = "sender_address";
  option (amino.name) = "juno/x/cwhooks/MsgRegisterContract";

  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;

  // The address of the sender
  string sender_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // The module key the contract is registered for
  string module = 2;

  // The contract address to register
  string contract_address = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgRegisterContractResponse
message MsgRegisterContractResponse {}

// MsgUnregisterContract
message MsgUnregisterContract {
  option (cosmos.msg.v1.signer) = "sender_address";
  option (amino.name) = "juno/x/cwhooks/MsgUnregisterContract";

  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;

  // The address of the sender
  string sender_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // The module key the contract is registered for
  string module = 2;

  // The contract address to unregister
  string contract_address = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgUnregisterContractResponse
message MsgUnregisterContractResponse {}
