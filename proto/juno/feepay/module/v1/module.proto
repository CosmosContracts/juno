syntax = "proto3";

package juno.feepay.module.v1;

import "cosmos/app/v1alpha1/module.proto";

option go_package = "github.com/CosmosContracts/juno/v31/api/juno/feepay/module/v1";

// Module is the config object of the mint module.
message Module {
  option (cosmos.app.v1alpha1.module) = {go_import: "github.com/CosmosContracts/juno/v31/x/feepay"};

  // authority defines the custom module authority. If not set, defaults to the
  // governance module.
  string authority = 1;
}
