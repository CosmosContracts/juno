syntax = "proto3";
package juno.votingsnapshot.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/CosmosContracts/juno/v30/x/voting-snapshot/types";

// Params is the governance-controlled config for x/voting-snapshot.
//
// LSTAllowlist: bech32 addresses of LST contracts whose delegations
// must NOT count toward voting power. Empty at v30 launch.
//
// RetentionWindowHeights: snapshots older than this many blocks are
// pruned by the EndBlocker. Zero disables pruning. Default ≈ 1 year
// at 2.5s blocks (12,614,400).
message Params {
  option (amino.name) = "juno/votingsnapshot/Params";
  option (gogoproto.equal) = true;

  repeated string lst_allowlist = 1;
  uint64 retention_window_heights = 2;
}
