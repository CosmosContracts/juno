[package]
name = "voting-power-probe"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-schema = "2.2.2"
cosmwasm-std = "2.2.2"
schemars = "0.8.22"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
codegen-units = 1
incremental = false
lto = true
opt-level = "z"
overflow-checks = true
panic = "abort"
strip = true
