---
name: build

on:
  push:
    paths:
      - "**.go"
      - "go.sum"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.25.2

jobs:
  build:
    runs-on: ubuntu-latest
    name: build
    steps:
      - uses: actions/checkout@v4
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build ./...

  test:
    runs-on: ubuntu-latest
    name: test
    steps:
      # checkout must precede setup-go so its module cache can key on go.sum
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # retry only the network step: transient proxy.golang.org stream errors
      # must not fail the job, while real test failures still do
      - name: Download modules
        run: |
          for i in 1 2 3; do
            go mod download && exit 0
            echo "go mod download failed (attempt $i), retrying in 10s"
            sleep 10
          done
          exit 1
      - name: Test
        run: go test ./...

  tidy:
    runs-on: ubuntu-latest
    name: tidy
    steps:
      - uses: actions/checkout@v4
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: |
          go mod tidy
          CHANGES_IN_REPO=$(git status --porcelain)
          if [[ -n "$CHANGES_IN_REPO" ]]; then
            echo "Repository is dirty. Showing 'git status' and 'git --no-pager diff' for debugging now:"
            git status && git --no-pager diff
            exit 1
          fi
