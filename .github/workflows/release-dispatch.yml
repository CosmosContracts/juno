name: Dispatch Release to juno-std

on:
  release:
    # "published" covers both full releases and draft-to-prerelease transitions.
    # Payload fields below determine whether the published release is a prerelease.
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to redispatch
        required: true
        type: string

permissions:
  contents: read

env:
  JUNO_REPO: "https://github.com/CosmosContracts/juno.git"
  JUNO_DIR: "proto"
  # Keep these selected proto revisions aligned with the dependency graph in go.mod.
  # .github/scripts/release-dispatch.test.js enforces that relationship offline.
  COSMOS_SDK_REPO: "https://github.com/cosmos/cosmos-sdk.git"
  COSMOS_SDK_REV: "v0.53.7"
  COSMOS_SDK_DIR: "proto"
  WASMD_REPO: "https://github.com/CosmWasm/wasmd.git"
  WASMD_REV: "v0.61.11"
  WASMD_DIR: "proto"
  COMETBFT_REPO: "https://github.com/cometbft/cometbft.git"
  COMETBFT_REV: "v0.38.23"
  COMETBFT_DIR: "proto"
  IBC_GO_REPO: "https://github.com/cosmos/ibc-go.git"
  IBC_GO_REV: "v10.6.0"
  IBC_GO_DIR: "proto"
  ICS23_REPO: "https://github.com/cosmos/ics23.git"
  ICS23_REV: "go/v0.11.0"
  ICS23_DIR: "proto"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out payload builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Never execute code from the release tag while DISPATCH_TOKEN is present.
          # The builder must be the exact revision containing this workflow run.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Dispatch release event
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ secrets.DISPATCH_TOKEN }}
          script: |
            const { buildDispatchRequest, validateReleaseTag } = require('./.github/scripts/release-dispatch');

            let payload = context.payload;
            try {
              if (!payload.release) {
                const releaseTag = validateReleaseTag(payload.inputs.release_tag);
                const { data: release } = await github.rest.repos.getReleaseByTag({
                  ...context.repo,
                  tag: releaseTag,
                });
                payload = { ...payload, release };
              }

              const request = buildDispatchRequest(payload, process.env);
              core.info(`Dispatching to ${request.owner}/${request.repo} with payload: ${JSON.stringify(request.client_payload)}`);
              await github.rest.repos.createDispatchEvent(request);
              core.info('Repository dispatch event sent successfully.');
            } catch (error) {
              core.setFailed(error.message);
            }
