name: Immutable v31 release

on:
  push:
    tags: ["v31.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v31 semantic tag to publish (fails if already released)
        required: true
        type: string

concurrency:
  # Serialize every publication. This closes races on sha-$COMMIT when two
  # version tags point at one commit and on mutable registry tag creation.
  group: release-publication-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  guard:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.guard.outputs.commit }}
      epoch: ${{ steps.guard.outputs.epoch }}
      image: ${{ steps.guard.outputs.image }}
    steps:
      # Publication policy comes from the reviewed workflow revision, never the tag.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . scripts/release/lib.sh
          validate_version "$TAG"
          github_auth=$(printf 'Authorization: Bearer %s' "$GH_TOKEN")
          response=$(mktemp)
          status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --header "$github_auth" --header 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          require_absent_http_status "$status" "release $TAG" || { cat "$response" >&2; exit 1; }
          rm -f "$response"
          git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          commit=$(resolve_local_tag_commit . "$TAG")
          validate_commit "$commit"
          epoch=$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit" --jq '.commit.committer.date | fromdateiso8601')
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
          echo "epoch=$epoch" >>"$GITHUB_OUTPUT"
          echo "image=ghcr.io/$repository" >>"$GITHUB_OUTPUT"

  binaries:
    needs: guard
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.guard.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build and verify tagged binary
        env:
          VERSION: ${{ env.TAG }}
          COMMIT: ${{ needs.guard.outputs.commit }}
          SOURCE_DATE_EPOCH: ${{ needs.guard.outputs.epoch }}
          ARCH: ${{ matrix.arch }}
          OUT_DIR: dist
        run: scripts/release/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  container:
    needs: guard
    env:
      IMAGE: ${{ needs.guard.outputs.image }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.guard.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Verify checked-out source identity
        env:
          COMMIT: ${{ needs.guard.outputs.commit }}
        run: |
          . scripts/release/lib.sh
          test "$(git rev-parse HEAD)" = "$COMMIT"
          test "$(resolve_local_tag_commit . "$TAG")" = "$COMMIT"
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Refuse existing immutable image tags (fail closed)
        env:
          COMMIT: ${{ needs.guard.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          repository=${IMAGE#ghcr.io/}
          token=$(curl --fail --silent --show-error --user "$GITHUB_ACTOR:$GH_TOKEN" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:$repository:pull" | jq -er .token)
          registry_auth=$(printf 'Authorization: Bearer %s' "$token")
          for ref in "$TAG" "sha-$COMMIT"; do
            response=$(mktemp)
            status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
              --header "$registry_auth" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/$repository/manifests/$ref")
            require_absent_http_status "$status" "container $IMAGE:$ref" || { cat "$response" >&2; exit 1; }
            rm -f "$response"
          done
      - name: Publish by immutable version and commit tags
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: release.Dockerfile
          target: image
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.TAG }}
            COMMIT=${{ needs.guard.outputs.commit }}
            SOURCE_DATE_EPOCH=${{ needs.guard.outputs.epoch }}
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:sha-${{ needs.guard.outputs.commit }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
      - name: Verify both published tags resolve to the claimed digest
        env:
          COMMIT: ${{ needs.guard.outputs.commit }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          for ref in "$TAG" "sha-$COMMIT"; do
            actual="sha256:$(docker buildx imagetools inspect --raw "$IMAGE:$ref" | sha256sum | cut -d ' ' -f 1)"
            test "$actual" = "$DIGEST" || {
              echo "published tag $ref resolves to $actual, expected $DIGEST" >&2
              exit 1
            }
          done
      - name: Record manifest-list and per-platform digests
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" >manifest.json
          jq -e -n --arg image "$IMAGE" --arg manifest "$DIGEST" \
            --slurpfile index manifest.json \
            '{image:$image,manifest_digest:$manifest,platforms:[$index[0].manifests[]|select(.platform.os=="linux" and (.platform.architecture=="amd64" or .platform.architecture=="arm64"))|{platform:(.platform.os+"/"+.platform.architecture),digest:.digest}]} | select((.platforms|length)==2 and ([.platforms[].platform]|unique|length)==2)' \
            >container-digests.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-digests
          path: container-digests.json
          retention-days: 1

  publish:
    needs: [guard, binaries, container]
    env:
      IMAGE: ${{ needs.guard.outputs.image }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    steps:
      # Only trusted workflow-revision scripts run while the write token exists.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: container-digests
          path: dist
      - name: Generate offline metadata and checksums
        env:
          COMMIT: ${{ needs.guard.outputs.commit }}
        run: |
          cp RELEASE-VERIFICATION.md dist/
          python3 scripts/release/metadata.py --directory dist --version "$TAG" \
            --commit "$COMMIT" --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA"
          . scripts/release/lib.sh
          generate_checksums dist
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Attest every release asset
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist/*
      - name: Attest the published container manifest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.container.outputs.digest }}
          push-to-registry: true
      - name: Atomically claim release tag and upload immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.guard.outputs.commit }}
        run: |
          . scripts/release/lib.sh
          git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(resolve_local_tag_commit . "$TAG")" = "$COMMIT"
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" \
            --notes "Immutable Juno release built from $COMMIT. Verify with RELEASE-VERIFICATION.md."