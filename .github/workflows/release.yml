name: Verifiable v31 release

on:
  push:
    tags: ["v31.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v31 semantic tag to publish (fails if a release already exists)
        required: true
        type: string

concurrency:
  group: release-publication-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.guard.outputs.tag }}
      tag_oid: ${{ steps.guard.outputs.tag_oid }}
      commit: ${{ steps.guard.outputs.commit }}
      epoch: ${{ steps.guard.outputs.epoch }}
      image: ${{ steps.guard.outputs.image }}
    steps:
      # Publication policy comes from the reviewed workflow revision, never the tag.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: guard
        env:
          EVENT_AFTER: ${{ github.event.after }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          . scripts/release/lib.sh
          validate_version "$REQUESTED_TAG"
          identity=$(resolve_remote_tag_identity . origin "$REQUESTED_TAG")
          tag_oid=${identity%% *}
          resolved_commit=${identity#* }
          if [ "$EVENT_NAME" = push ]; then
            validate_commit "$EVENT_AFTER"
            if [ "$EVENT_AFTER" != "$tag_oid" ]; then
              echo "push event tag object $EVENT_AFTER is no longer current ($tag_oid peeled to $resolved_commit)" >&2
              exit 1
            fi
          fi
          github_auth=$(printf 'Authorization: Bearer %s' "$GH_TOKEN")
          response=$(mktemp)
          status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --header "$github_auth" --header 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$REQUESTED_TAG")
          require_absent_http_status "$status" "release $REQUESTED_TAG" || { cat "$response" >&2; exit 1; }
          rm -f "$response"
          epoch=$(gh api "repos/$GITHUB_REPOSITORY/commits/$resolved_commit" --jq '.commit.committer.date | fromdateiso8601')
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          {
            echo "tag=$REQUESTED_TAG"
            echo "tag_oid=$tag_oid"
            echo "commit=$resolved_commit"
            echo "epoch=$epoch"
            echo "image=ghcr.io/$repository"
          } >>"$GITHUB_OUTPUT"

  binaries:
    needs: guard
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.guard.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Revalidate source before building
        env:
          COMMIT: ${{ needs.guard.outputs.commit }}
          TAG: ${{ needs.guard.outputs.tag }}
          TAG_OID: ${{ needs.guard.outputs.tag_oid }}
        run: |
          # shellcheck disable=SC2153 # COMMIT is supplied by the step environment.
          . scripts/release/lib.sh
          test "$(git rev-parse HEAD)" = "$COMMIT"
          test "$(resolve_remote_tag_identity . origin "$TAG" "$TAG_OID" "$COMMIT")" = "$TAG_OID $COMMIT"
      - name: Build and verify tagged binary
        env:
          VERSION: ${{ needs.guard.outputs.tag }}
          COMMIT: ${{ needs.guard.outputs.commit }}
          SOURCE_DATE_EPOCH: ${{ needs.guard.outputs.epoch }}
          ARCH: ${{ matrix.arch }}
          OUT_DIR: dist
        run: scripts/release/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  container:
    needs: guard
    env:
      IMAGE: ${{ needs.guard.outputs.image }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.guard.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      # Run release policy only from the reviewed workflow revision.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: policy
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Revalidate source immediately before digest publication
        env:
          COMMIT: ${{ needs.guard.outputs.commit }}
          TAG: ${{ needs.guard.outputs.tag }}
          TAG_OID: ${{ needs.guard.outputs.tag_oid }}
        run: |
          . policy/scripts/release/lib.sh
          test "$(git -C source rev-parse HEAD)" = "$COMMIT"
          test "$(resolve_remote_tag_identity source origin "$TAG" "$TAG_OID" "$COMMIT")" = "$TAG_OID $COMMIT"
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # GHCR tags are mutable and cannot be claimed with create-only semantics.
      # Push a canonical manifest by content digest only; no registry tag is made.
      - name: Publish content-addressed container manifest without tags
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: source
          file: source/release.Dockerfile
          target: image
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.guard.outputs.tag }}
            COMMIT=${{ needs.guard.outputs.commit }}
            SOURCE_DATE_EPOCH=${{ needs.guard.outputs.epoch }}
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          provenance: mode=max
          sbom: true
      - name: Verify and record manifest-list and platform digests
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          . policy/scripts/release/lib.sh
          case "$DIGEST" in
            sha256:*) validate_sha256 "${DIGEST#sha256:}" ;;
            *) echo "invalid container digest: $DIGEST" >&2; exit 1 ;;
          esac
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" >manifest.json
          actual="sha256:$(sha256sum manifest.json | cut -d ' ' -f 1)"
          test "$actual" = "$DIGEST"
          jq -e -n --arg image "$IMAGE" --arg manifest "$DIGEST" \
            --slurpfile index manifest.json \
            '{image:$image,manifest_digest:$manifest,reference:($image+"@"+$manifest),platforms:[$index[0].manifests[]|select(.platform.os=="linux" and (.platform.architecture=="amd64" or .platform.architecture=="arm64"))|{platform:(.platform.os+"/"+.platform.architecture),digest:.digest}]} | select((.platforms|length)==2 and ([.platforms[].platform]|unique|length)==2)' \
            >container-digests.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-digests
          path: container-digests.json
          retention-days: 1

  publish:
    needs: [guard, binaries, container]
    env:
      IMAGE: ${{ needs.guard.outputs.image }}
      TAG: ${{ needs.guard.outputs.tag }}
      TAG_OID: ${{ needs.guard.outputs.tag_oid }}
      COMMIT: ${{ needs.guard.outputs.commit }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    steps:
      # Only trusted workflow-revision scripts run while the write token exists.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: container-digests
          path: dist
      - name: Generate offline metadata and checksums
        run: |
          # shellcheck disable=SC2153 # COMMIT is supplied by the job environment.
          cp RELEASE-VERIFICATION.md dist/
          python3 scripts/release/metadata.py --directory dist --version "$TAG" \
            --commit "$COMMIT" --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA"
          . scripts/release/lib.sh
          generate_checksums dist
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Revalidate source before asset attestations
        run: |
          # shellcheck disable=SC2153 # COMMIT is supplied by the job environment.
          . scripts/release/lib.sh
          test "$(resolve_remote_tag_identity . origin "$TAG" "$TAG_OID" "$COMMIT")" = "$TAG_OID $COMMIT"
      - name: Attest every release asset
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist/*
      - name: Revalidate source before container attestation
        run: |
          # shellcheck disable=SC2153 # COMMIT is supplied by the job environment.
          . scripts/release/lib.sh
          test "$(resolve_remote_tag_identity . origin "$TAG" "$TAG_OID" "$COMMIT")" = "$TAG_OID $COMMIT"
      - name: Attest the content-addressed container manifest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.container.outputs.digest }}
          push-to-registry: true
      - name: Revalidate and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2153 # COMMIT is supplied by the job environment.
          . scripts/release/lib.sh
          test "$(resolve_remote_tag_identity . origin "$TAG" "$TAG_OID" "$COMMIT")" = "$TAG_OID $COMMIT"
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" \
            --notes "Verifiable Juno release built from $COMMIT. The container is published only at the digest recorded in container-digests.json."
